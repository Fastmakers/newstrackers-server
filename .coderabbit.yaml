# CodeRabbit 설정
# 문서: https://docs.coderabbit.ai/configure/yaml

language: "ko-KR"

reviews:
  # PR 요약 자동 생성
  auto_review:
    enabled: true
    drafts: false          # 드래프트 PR은 리뷰 skip
    base_branches:
      - main
      - develop

  # 리뷰 프로필: assertive(상세) / chill(간결)
  profile: "assertive"

  # 인라인 코드 제안 활성화
  request_changes_workflow: false

  # 리뷰 포커스 경로
  path_filters:
    - "newstrackers-server/app/**"
    - "newstrackers-server/alembic/versions/**"
    - "newstrackers-frontend/src/**"
    - "!**/.venv/**"
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/dist/**"
    - "!**/*.lock"
    - "!**/*.egg-info/**"
    - "!**/logs/**"
    - "!**/data/**"

  # 파일별 리뷰 지침
  path_instructions:
    - path: "newstrackers-server/app/services/**"
      instructions: |
        - 비동기 처리 시 asyncio/run_in_executor 사용이 적절한지 확인
        - LLM 호출 비용이 발생하는 메서드는 불필요한 중복 호출 여부 체크
        - 예외 처리가 파이프라인 전체를 중단시키지 않는지 확인

    - path: "newstrackers-server/app/db/**"
      instructions: |
        - ORM 쿼리에 N+1 문제가 없는지 확인
        - FOR UPDATE 사용 시 트랜잭션 범위가 최소화되어 있는지 확인
        - 인덱스가 없는 컬럼에 대한 필터/정렬 여부 체크

    - path: "newstrackers-server/alembic/versions/**"
      instructions: |
        - downgrade() 함수가 upgrade()를 완전히 역전하는지 확인
        - 데이터 손실 가능성이 있는 컬럼 삭제/타입 변경 여부 경고
        - down_revision 체인이 올바른지 확인

    - path: "newstrackers-server/app/api/**"
      instructions: |
        - 엔드포인트가 비즈니스 로직 없이 얇게 유지되는지 확인 (로직은 서비스 레이어)
        - 인증/권한 체크 누락 여부 확인
        - 응답 스키마와 실제 반환 타입이 일치하는지 확인

    - path: "newstrackers-frontend/src/**"
      instructions: |
        - API 응답 에러 처리가 누락된 곳 확인
        - 폴링/인터벌이 cleanup 없이 누수될 가능성 체크 (clearInterval)
        - any 타입 남용 여부 확인

  # 요약에 포함할 항목
  collapse_walkthrough: false

chat:
  # PR 댓글로 @coderabbitai 멘션 시 응답 활성화
  auto_reply: true
